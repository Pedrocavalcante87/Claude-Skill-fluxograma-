<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITULO_DA_PAGINA}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: carta náutica de despacho. Cabeçalho curto, fluxograma largo em três raias (regra, frota, fora do escopo), depois leituras em colunas e tabelas. */
:root{
  --paper:#E8EEF0; --surface:#F7FAFB; --ink:#0B2230; --ink2:#2F4855; --muted:#567080; --line:#B4C4CB;
  --regra:#0B6B63; --regra-t:#CFE8E4;
  --frota:#8F4A00; --frota-t:#F5E1C6;
  --fora:#9C3049; --fora-t:#F3D7DD;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0A1820; --surface:#11262F; --ink:#E4EEF1; --ink2:#B7C9D0; --muted:#8AA3AE; --line:#2C4754;
    --regra:#5CCFC0; --regra-t:#123A3A; --frota:#F0AE5A; --frota-t:#3A2A12; --fora:#EE8DA0; --fora-t:#3D1A25;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0A1820; --surface:#11262F; --ink:#E4EEF1; --ink2:#B7C9D0; --muted:#8AA3AE; --line:#2C4754;
  --regra:#5CCFC0; --regra-t:#123A3A; --frota:#F0AE5A; --frota-t:#3A2A12; --fora:#EE8DA0; --fora-t:#3D1A25;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--body);padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
header{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px 64px;align-items:end}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h1{font:700 clamp(40px,6vw,72px)/.95 var(--display);margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font:700 30px/1 var(--display);margin:0 0 6px;letter-spacing:.01em}
.lede{margin:0;max-width:62ch;color:var(--ink2)}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:16px 0 0;padding:0;list-style:none;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts b{font:700 28px/1 var(--display);color:var(--ink);letter-spacing:0;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:10px 26px;font-size:13px;color:var(--ink2);align-items:center;margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{flex:none}
.legend .sw{width:22px;height:14px;border:1.5px solid var(--line);border-radius:2px;display:inline-block}
.figwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface);border-radius:4px}
figure{margin:0}
figure svg{display:block;width:100%;min-width:1180px;height:auto;color:var(--ink)}
figcaption{font-size:13px;color:var(--muted);margin-top:10px;max-width:90ch}
/* svg */
.band{fill:var(--lane-t);opacity:.5;stroke:var(--lane);stroke-width:1;stroke-dasharray:3 4}
.lane.regra{--lane:var(--regra);--lane-t:var(--regra-t)}
.lane.frota{--lane:var(--frota);--lane-t:var(--frota-t)}
.lane.fora{--lane:var(--fora);--lane-t:var(--fora-t)}
.lt{font:500 11px var(--mono);letter-spacing:.1em;fill:var(--lane)}
.node.regra{--lane:var(--regra);--lane-t:var(--regra-t)}
.node.frota{--lane:var(--frota);--lane-t:var(--frota-t)}
.node.fora{--lane:var(--fora);--lane-t:var(--fora-t)}
.node.ink{--lane:var(--ink);--lane-t:var(--surface)}
.node rect,.node polygon{fill:var(--surface);stroke:var(--lane);stroke-width:1.6}
.node.llm rect,.node.llm polygon{fill:var(--lane-t)}
.node.search rect{stroke-dasharray:none;stroke-width:1.6}
.node.tool rect{stroke-width:2.4}
.tag{font:500 9.5px var(--mono);letter-spacing:.1em;fill:var(--lane)}
.t{font:600 13.5px var(--body);fill:var(--ink)}
.c{font:400 10px var(--mono);fill:var(--muted)}
.c2{font:500 10.5px var(--mono);fill:var(--ink)}
.d{font:400 11px var(--body);fill:var(--ink2)}
.done{fill:var(--lane)}
.e{fill:none;stroke-width:1.7;stroke-linejoin:round}
.e.regra{stroke:var(--regra)}.e.frota{stroke:var(--frota)}.e.fora{stroke:var(--fora)}.e.ink{stroke:var(--ink)}
.mk.regra{fill:var(--regra)}.mk.frota{fill:var(--frota)}.mk.fora{fill:var(--fora)}.mk.ink{fill:var(--ink)}
.el{font:500 10.5px var(--body);fill:var(--ink2)}
.start{fill:var(--ink)}
.store path,.store ellipse{fill:var(--surface);stroke:var(--muted);stroke-width:1.4}
.term rect{fill:var(--ink)}
.ttag{font:500 9.5px var(--mono);letter-spacing:.1em;fill:var(--paper);opacity:.75}
.tt{font:600 13px var(--body);fill:var(--paper)}
.note rect{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
/* sections */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px 40px}
.col{border-top:3px solid var(--lane);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.col.regra{--lane:var(--regra)}.col.frota{--lane:var(--frota)}.col.fora{--lane:var(--fora)}
.col h3{font:700 24px/1 var(--display);margin:0;color:var(--lane)}
.col p{margin:0;color:var(--ink2);max-width:60ch}
.col .why{font-size:13.5px;color:var(--ink)}
.col .why b{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px 56px}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px;max-width:60ch}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px 8px 0;border-bottom:1.5px solid var(--ink)}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
.mono{font-family:var(--mono);font-size:13px}
.pill{display:inline-block;font:500 11px var(--mono);letter-spacing:.06em;padding:2px 8px;border:1.5px solid var(--lane);color:var(--lane);border-radius:2px}
.pill.regra{--lane:var(--regra)}.pill.frota{--lane:var(--frota)}.pill.fora{--lane:var(--fora)}
.win td{font-weight:600}
.block td{color:var(--fora)}
.status{border-left:3px solid var(--ink);padding:4px 0 4px 18px;max-width:78ch;color:var(--ink2)}
.status b{color:var(--ink)}
.status code{font:400 13px var(--mono);color:var(--ink)}
@media (max-width:820px){header,.two{grid-template-columns:minmax(0,1fr)}}
/* simulador */
.sim{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:18px 20px 20px;margin:0 0 14px;display:flex;flex-direction:column;gap:14px}
.sim-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.sim-head h3{font:700 24px/1 var(--display);margin:0}
.sim-note{font-size:12.5px;color:var(--muted)}
.sim-ask{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.sim-ask .f{display:flex;flex-direction:column;gap:4px;flex:1 1 320px}
.sim-ask label,.k{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sim input[type=text]{font:400 15px var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:9px 12px;width:100%}
.btn{font:600 13px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--ink);border-radius:3px;padding:9px 14px;cursor:pointer}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:focus-visible,.chip:focus-visible,.sim input:focus-visible{outline:3px solid var(--regra);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12.5px var(--body);color:var(--ink2);background:transparent;border:1.5px solid var(--lane,var(--line));border-radius:2px;padding:5px 10px;cursor:pointer}
.chip:hover{background:var(--paper)}
.chip i{font:500 10px var(--mono);letter-spacing:.08em;color:var(--lane,var(--muted));font-style:normal;margin-right:6px}
.chip.regra{--lane:var(--regra)}.chip.frota{--lane:var(--frota)}.chip.fora{--lane:var(--fora)}
.sim-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1fr);gap:20px 32px}
.sim-grid>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.now-t{font:700 22px/1.1 var(--display);min-height:1.1em}
.now-d{font-size:13.5px;color:var(--ink2);max-width:52ch}
.now-d code,.sim dd code{font:400 12.5px var(--mono);color:var(--ink)}
.sim dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.sim dt{font:500 12px var(--mono);color:var(--muted);padding-top:1px}
.sim dd{margin:0;color:var(--ink);overflow-wrap:anywhere;padding-left:8px;border-left:2px solid transparent}
.sim dd.chg{border-left-color:var(--frota);background:var(--frota-t)}
.sim dd.empty{color:var(--muted)}
.sim ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;max-height:210px;overflow:auto}
.sim li{display:flex;gap:8px;align-items:baseline;color:var(--ink2)}
.sim li.cur{color:var(--ink);font-weight:600}
.sim li .m{font:400 12px var(--mono)}
.sim li .badge{font:500 9.5px var(--mono);letter-spacing:.08em;border:1.5px solid var(--regra);color:var(--regra);padding:0 5px;border-radius:2px}
.sim li .badge.tl{border-color:var(--frota);color:var(--frota)}
svg.running .node:not(.seen):not(.active),svg.running .term:not(.seen):not(.active),svg.running .store:not(.seen):not(.active),svg.running .e:not(.seen):not(.active),svg.running .start:not(.seen):not(.active){opacity:.25}
svg .e.seen{stroke-width:3}
svg .node.seen rect,svg .node.seen polygon{stroke-width:2.8;fill:var(--lane-t)}
svg .term.seen rect{fill:var(--ink);stroke:var(--regra);stroke-width:2}
svg .node.active rect,svg .node.active polygon{stroke:var(--ink);stroke-width:4;fill:var(--lane-t)}
svg .term.active rect{stroke:var(--frota);stroke-width:4}
svg .store.active path,svg .store.active ellipse{stroke:var(--ink);stroke-width:3}
svg .start.active{stroke:var(--frota);stroke-width:4}
svg .e.active{stroke-width:4}
@media (prefers-reduced-motion:no-preference){
  svg .e.active{stroke-dasharray:9 6;animation:flow .7s linear infinite}
  svg .node.active rect,svg .node.active polygon{animation:pulse 1.2s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-15}}
  @keyframes pulse{50%{stroke-width:2.2}}
}
@media (max-width:980px){.sim-grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head><body><div class="wrap">
<header>
  <div>
    <p class="eyebrow">{{EYEBROW: contexto · parte}}</p>
    <h1>{{TITULO_H1}}</h1>
  </div>
  <div>
    <p class="lede">{{LEDE: 1 a 3 frases sobre o que o processo faz, so com fatos fornecidos}}</p>
    <ul class="facts"><li><b>{{N}}</b>{{rotulo}}</li><li><b>{{N}}</b>{{rotulo}}</li><li><b>{{N}}</b>{{rotulo}}</li></ul>
  </div>
</header>

<section aria-labelledby="fluxo">
  <h2 id="fluxo">{{TITULO_DA_SECAO}}</h2>
  <p class="sub">{{SUBTITULO: como ler o fluxograma}}</p>
  <!-- LEGENDA: manter apenas os simbolos realmente usados no SVG. Blocos prontos em references/design-system.md -->
  <div class="legend" aria-label="Legenda">
    {{LEGENDA}}
  </div>
  <!-- SIMULADOR (opcional): colar assets/simulador-bloco.html aqui e o <script> no fim do body -->
  <div class="figwrap">
    <figure>
<svg viewBox="0 0 {{LARGURA}} {{ALTURA}}" role="img" aria-label="{{DESCRICAO_ACESSIVEL_DO_FLUXO}}">
<defs><marker id="m-regra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk regra" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-frota" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk frota" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-fora" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk fora" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk ink" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<!-- RAIAS, INICIO, NOS, SETAS, TERMINAIS: ver references/design-system.md (secao Geometria) e references/exemplos.md -->
{{SVG_CONTEUDO}}
</svg>
    </figure>
  </div>
  <figcaption>{{LEGENDA_DA_FIGURA: como o fluxo se comporta (ciclos, desvios, pontos de saida)}}</figcaption>
</section>

</div>
</body></html>
